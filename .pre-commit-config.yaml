repos:
  - repo: local
    hooks:
      - id: bend-check
        name: Bend proofs and host syntax
        entry: bun scripts/check.mjs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: agents-md-project-index
        name: AGENTS.md project index
        entry: bun scripts/agents-index.mjs check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: bend-test
        name: Native Bend and host integration
        entry: bun run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
