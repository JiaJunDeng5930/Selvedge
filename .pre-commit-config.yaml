repos:
  - repo: local
    hooks:
      - id: rocq-check
        name: Rocq proofs, extraction and host syntax
        entry: bun run check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]
      - id: runtime-test
        name: Extracted runtime end-to-end behavior
        entry: bun run test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push, manual]
