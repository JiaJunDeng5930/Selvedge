name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install the pinned Bend release
        run: bash scripts/install-bend.sh
      - name: Check proof obligations and syntax
        run: npm run check
      - name: Run native integration and negative proof tests
        run: npm test
      - name: Check tracked-file index
        run: npm run index:check
