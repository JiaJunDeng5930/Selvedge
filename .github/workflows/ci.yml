name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # NOTE: Native emission needs more memory than the 7 GB macOS ARM runners provide.
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    env:
      BEND_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Install the pinned Bend release
        run: bash scripts/install-bend.sh
      - name: Install Linux process isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor
          # NOTE: Ubuntu restricts unprofiled user namespaces, including bwrap's loopback setup.
          sudo tee /etc/apparmor.d/selvedge-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile selvedge-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/selvedge-ci-bwrap
          bwrap --unshare-user --unshare-pid --unshare-net --cap-drop ALL \
            --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: Check proof obligations and syntax
        run: npm run check
      - name: Run native integration and negative proof tests
        run: npm test
      - name: Check tracked-file index
        run: npm run index:check
