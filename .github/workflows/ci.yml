name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features

      - name: Check AGENTS index freshness
        run: cargo xtask agents-index check

      - name: Check requirement comments
        run: cargo xtask req check --all

      - name: Check requirement anchors
        run: |
          if git show origin/${{ github.base_ref }}:AGENTS.md | grep -q "BEGIN AGENTS_MD_REQUIREMENT_INDEX"; then
            cargo xtask req check --base origin/${{ github.base_ref }}
          else
            echo "requirement anchor base check starts after the requirement system exists on the base branch"
          fi
