[package]
name = "selvedge-model-providers"
edition = "2024"
publish = false

[dependencies]
selvedge-config-model = { path = "../config-model" }
selvedge-model-credentials = { path = "../model-credentials" }
thiserror = "2.0.18"

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
