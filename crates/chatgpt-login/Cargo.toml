[package]
name = "chatgpt-login"
edition = "2024"
publish = false

[dependencies]
chatgpt-auth = { path = "../chatgpt-auth" }
chrono = { workspace = true, features = ["clock", "std"] }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
selvedge-client = { path = "../client" }
selvedge-config = { path = "../config" }
selvedge-model-credentials = { path = "../model-credentials" }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
axum = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
selvedge-logging = { path = "../logging" }
selvedge-test-support = { path = "../test-support", features = ["config", "http"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
