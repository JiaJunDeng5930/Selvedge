[package]
name = "selvedge-local-client"
edition = "2024"
publish = false

[dependencies]
bytes = { workspace = true }
http-body-util = { workspace = true }
# Hyper exposes typed oversized-header classification behind its server feature.
hyper = { workspace = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
futures-core = { workspace = true }
selvedge-local-protocol = { path = "../local-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["io-util"] }

[dev-dependencies]
futures-util = { workspace = true }
selvedge-test-support = { path = "../test-support", features = ["local-transport"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints]
workspace = true
