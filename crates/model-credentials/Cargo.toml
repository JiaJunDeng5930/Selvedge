[package]
name = "selvedge-model-credentials"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.145"
selvedge-config = { path = "../config" }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
