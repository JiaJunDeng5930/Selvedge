[package]
name = "selvedge-harness"
edition = "2024"
publish = false

[dependencies]
futures-util = { workspace = true }
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "transport-async-rw"] }
selvedge-command-model = { path = "../command-model" }
selvedge-config-model = { path = "../config-model" }
selvedge-db = { path = "../db" }
selvedge-domain-model = { path = "../domain-model" }
selvedge-script-runtime = { path = "../script-runtime" }
selvedge-router = { path = "../router" }
rustix = { version = "1.1.4", features = ["process"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.13", features = ["codec"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
selvedge-api = { path = "../api" }
selvedge-core = { path = "../core" }
selvedge-test-support = { path = "../test-support", features = ["db-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
