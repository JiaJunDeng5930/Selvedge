[package]
name = "selvedge-api"
edition = "2024"
publish = false

[dependencies]
chatgpt-api = { path = "../chatgpt-api" }
futures-util = { workspace = true }
selvedge-command-model = { path = "../command-model" }
selvedge-client = { path = "../client" }
selvedge-config = { path = "../config" }
selvedge-domain-model = { path = "../domain-model" }
selvedge-model-providers = { path = "../model-providers" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
async-stream = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
selvedge-config = { path = "../config" }
selvedge-model-credentials = { path = "../model-credentials" }
selvedge-logging = { path = "../logging" }
selvedge-test-support = { path = "../test-support", features = ["chatgpt-auth", "config", "http"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
