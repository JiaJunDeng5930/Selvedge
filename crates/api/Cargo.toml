[package]
name = "selvedge-api"
edition = "2024"
publish = false

[dependencies]
chatgpt-api = { path = "../chatgpt-api" }
futures = "0.3.31"
selvedge-command-model = { path = "../command-model" }
selvedge-client = { path = "../client" }
selvedge-config = { path = "../config" }
selvedge-domain-model = { path = "../domain-model" }
selvedge-model-providers = { path = "../model-providers" }
serde_json = "1.0.149"
tokio = { version = "1.42.0", features = ["rt", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4"] }

[dev-dependencies]
async-stream = "0.3.6"
axum = "0.8.6"
bytes = "1.10.1"
http = "1.3.1"
selvedge-config = { path = "../config" }
selvedge-logging = { path = "../logging" }
selvedge-test-support = { path = "../test-support", features = ["chatgpt-auth", "config", "http"] }
tempfile = "3.23.0"
tokio = { version = "1.42.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
