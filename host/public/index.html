<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Selvedge</title>
  <link rel="stylesheet" href="/vendor/desktop-tokens.css">
  <link rel="stylesheet" href="/vendor/desktop.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/board.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#surface">Skip to workspace</a>
  <header class="app-header">
    <div class="app-brand">
      <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Toggle tasks" aria-expanded="true" title="Toggle tasks"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 4v16"/></svg></button>
      <a class="brand" href="/" aria-label="Selvedge home">Selvedge</a>
    </div>
    <div class="app-tools">
      <span id="connection" role="status" data-status="connecting">Connecting…</span>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Change color theme" title="Change color theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg></button>
      <button id="access-toggle" class="icon-button" type="button" aria-label="Local server access" title="Local server access"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="4"/><path d="m11 12 9 9m-5-5 3-3m-1 5 3-3"/></svg></button>
    </div>
  </header>
  <button id="sidebar-dismiss" class="sidebar-scrim" type="button" aria-label="Close tasks" tabindex="-1" hidden></button>
  <dialog id="access" class="access-panel" aria-labelledby="access-title" hidden>
    <button id="access-close" class="icon-button dialog-close" type="button" aria-label="Close local server access"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    <h2 id="access-title">Connect to your workspace</h2>
    <p>Use the local access token printed by the Selvedge server. This is not your ChatGPT credential.</p>
    <form id="access-form">
      <label class="field">Local access token <input id="token" type="password" autocomplete="off" required></label>
      <button id="connect" class="primary" type="submit">Connect</button>
    </form>
  </dialog>
  <p id="error" class="connection-error" role="alert" hidden></p>
  <main id="surface" tabindex="-1"><div class="loading-surface">Opening your workspace…</div></main>
</body>
</html>
